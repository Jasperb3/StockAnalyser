[project]
name = "stock_analyser"
version = "0.2.0"
description = "stock_analyser using crewAI"
authors = [{ name = "Benjamin Jasper", email = "ben.j.jasper@gmail.com" }]
requires-python = ">=3.12.9,<3.13"
dependencies = [
    "crewai[tools]>=0.105.0,<1.0.0",
    "python-dotenv>=1.0.1",
    "html2text>=2024.2.26",
    "sec-api>=1.0.29",
    "langtrace-python-sdk>=3.8.3",
    "trafilatura>=2.0.0",
    "ollama>=0.4.7",
    "google-generativeai>=0.8.4",
    "markdown>=3.7",
    "yfinance>=0.2.54",
    "numpy>=2.2.3",
    "pandas>=2.2.3",
    "matplotlib>=3.10.1",
    "selenium>=4.29.0",
    "google-auth-oauthlib>=1.2.1",
    "tavily-python>=0.5.1",
    "fmpsdk>=20250102.0",
    "nasdaq-data>=0.1.1",
    "exa-py>=1.8.9",
    "palettable==3.3.3",
    "mplfinance>=0.12.10b0",
    "markdown-pdf>=1.4",
    "qdrant-client>=1.13.3",
    "google-genai>=1.2.0",
]

[project.scripts]
kickoff = "stock_analyser.main:kickoff"
plot = "stock_analyser.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
