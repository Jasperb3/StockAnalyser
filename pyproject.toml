[project]
name = "stock_analyser"
version = "0.2.0"
description = "stock_analyser using crewAI"
authors = [{ name = "Benjamin Jasper", email = "ben.j.jasper@gmail.com" }]
requires-python = ">=3.12.9,<3.13"
dependencies = [
    "crewai[tools]>=0.130.0,<1.0.0",
    "python-dotenv>=1.1.0",
    "html2text>=2025.4.15",
    "sec-api>=1.0.32",
    "trafilatura>=2.0.0",
    "ollama>=0.5.1",
    "markdown>=3.8",
    "yfinance>=0.2.63",
    "numpy>=2.3.1",
    "pandas>=2.3.0",
    "matplotlib>=3.10.3",
    "selenium>=4.33.0",
    "google-auth-oauthlib>=1.2.2",
    "tavily-python>=0.7.8",
    "fmpsdk>=20250102.0",
    "nasdaq-data>=0.1.1",
    "exa-py>=1.14.10",
    "palettable==3.3.3",
    "mplfinance>=0.12.10b0",
    "qdrant-client>=1.14.3",
    "google-genai>=1.21.1",
    "weasyprint>=65.1",
    "md2pdf>=1.0.1",
    "ta-lib>=0.6.4",
    "plotly>=6.1.2",
    "ipython>=9.3.0",
    "ipykernel>=6.29.5",
    "nbformat>=5.10.4",
    "scipy>=1.15.3",
    "pytest>=8.4.0",
    "ta>=0.11.0",
    "bamboo-ta>=0.9.4",
    "groq>=0.26.0",
    "linkup-sdk>=0.2.7",
    "scikit-learn>=1.6.1",
    "finvizfinance>=1.1.0",
]

[project.scripts]
kickoff = "stock_analyser.main:kickoff"
plot = "stock_analyser.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
