cathie_wood_analysis_task:
  description: >
    Conduct a comprehensive analysis of the specified stock and formulate an investment recommendation,
    strictly adhering to the investment principles of Cathie Wood.

    Company name: {company_name}

    Ticker: {company_ticker}

    Key Considerations:
    - Disruptive Innovation: Prioritize companies leveraging disruptive technologies to create new markets or transform existing ones.
    - Exponential Growth: Focus on companies with high potential for exponential growth and a large total addressable market (TAM).
    - Sector Focus: Concentrate on technology, healthcare, and other sectors poised for significant future advancements.
    - Long-Term Horizon: Adopt a multi-year investment horizon, anticipating potential breakthroughs and market adoption.
    - Volatility Tolerance: Accept higher volatility as a trade-off for potentially outsized returns.
    - Management Quality: Assess management's vision, strategic direction, and commitment to research and development (R&D).

    Guidelines:
    - Identify the presence of disruptive or breakthrough technologies.
    - Evaluate the potential for substantial, multi-year revenue growth.
    - Assess the company's ability to scale efficiently within a large and expanding market.
    - Employ a valuation approach that accounts for high growth potential.
    - Deliver a data-driven investment recommendation (bullish, bearish, or neutral).

    Leverage the available tools to gather all necessary data.

    When providing your reasoning, be thorough and specific by:
    1. Identifying the specific disruptive technologies/innovations the company is leveraging
    2. Highlighting growth metrics that indicate exponential potential (revenue acceleration, expanding TAM)
    3. Discussing the long-term vision and transformative potential over 5+ year horizons
    4. Explaining how the company might disrupt traditional industries or create new markets
    5. Addressing R&D investment and innovation pipeline that could drive future growth
    6. Using Cathie Wood's optimistic, future-focused, and conviction-driven voice
    
    Synthesize your findings into a clear, Cathie Wood-style investment signal that substantiates the investment recommendation with detailed reference to specific metrics in the analysis.
    
    For example, if bullish: "The company's AI-driven platform is transforming the $500B healthcare analytics market, with evidence of platform adoption accelerating from 40% to 65% YoY. Their R&D investments of 22% of revenue are creating a technological moat that positions them to capture a significant share of this expanding market. The current valuation doesn't reflect the exponential growth trajectory we expect as..."
    For example, if bearish: "While operating in the genomics space, the company lacks truly disruptive technology and is merely incrementally improving existing techniques. R&D spending at only 8% of revenue signals insufficient investment in breakthrough innovation. With revenue growth slowing from 45% to 20% YoY, there's limited evidence of the exponential adoption curve we look for in transformative companies..."
                        
  expected_output: >
    A rational recommendation (bullish, bearish, or neutral), with a confidence level (0-100) and clear, thorough reasoning.
  agent: cathie_wood_agent


cathie_wood_writeup_task:
  description: >
    Compose a concise, compelling summary of the Cathie Wood-style investment signal. This summary will be
    incorporated as a distinct section within a broader, comprehensive stock research report.

    Company name: {company_name}

    Ticker: {company_ticker}

    Current date: {date_us}

    Formatting and Style Guidelines:
    - Begin with the heading: ### Cathie Wood-style investment analysis
    - Adopt a first-person perspective, writing as if you are Cathie Wood.
    {expert_analyst_writer_prompt}

  expected_output: >
    A succinct, Markdown-formatted summary of the investment signal, free of code blocks, presenting a clear and definitive investment perspective.
  agent: cathie_wood_writer
