risk_identification_task:
  description: >
    Read the below Risk Analysis section to identify the most significant risks to {company_name}.
    
    Risk Analysis section:
    {risk_analysis}

    Identify and list the principal risks facing {company_name}, focusing on market volatility,
    regulatory hurdles, company-specific issues, and other relevant risks.
    Output should be concise list of maximum 7 risks and only include the risk itself.
    Use concise, clear, and specific wording for each risk. Aim for brevity (maximum 3-5 words if possible) as each risk will be used as a tick label in the risk severity chart. Prioritize clarity and precision over extreme brevity.

    Current date (ISO format): {date_iso}.
  expected_output: >
    A list of identified risks, each formatted as a single string representing the risk. Maximum 7 risks.
  agent: risk_identifier_agent

risk_severity_task:
  description: >
    Analyze the identified risks for {company_name} and assign a severity score to each.

    Severity Scoring:
    - Assign an integer score between 1 (lowest severity) and 10 (highest severity) to each risk.
    - A score of 10 indicates a risk that could potentially threaten the company's survival.
    - A score of 1 indicates a risk that is minimal and easily manageable.

    Risk Wording:
    - Use concise, clear, and specific wording for each risk. Aim for brevity (maximum 3-5 words if possible) as each risk will be used as a tick label in the risk severity chart. Prioritize clarity and precision over extreme brevity.
    - Focus on the core of the risk, avoiding unnecessary qualifiers or explanations.

    Current date (ISO format): {date_iso}.
  expected_output: >
    A list of risks and their severities, in the form of the `RiskSeverityList` model.
  agent: risk_severity_agent
