research_task:
  description: >
    You are researching content for the "Market & Industry Context" section of a stock analysis report about the stock of the following company: 

    Company name: {company_name}.

    Company ticker: {company_ticker}.

    Website: {company_website}

    Industry: {industry}.

    Current date (ISO format): {date_iso}.

    Gather data and insights on the market and industry to populate the `MarketIndustryContextModel`.
    Focus on gathering information for the following fields:
    - `company_information`: Topline information about the company.
    - `management_information`: Information about the company's management, especially its CEO or equivalent.
    - `key_products_and_services`: Key products and services offered by the company.
    - `business_model`: How the company generates revenue.
    - `market_overview`: Overall market size, current conditions, and demand drivers.
    - `macroeconomic_factors`: Current economic trends (e.g., interest rates, inflation) and geopolitical factors impacting the industry.
    - `regulatory_environment`: Key regulations and policies impacting the industry.
    - `industry_trends`: Key trends shaping the industry.
    - `industry_growth_forecasts`: Projections for industry growth, including size and demand drivers.
    - `industry_leaders`: Information about the industry leaders and how {company_name} compares to them.

    Use all available tools systematically to gather this information.
  expected_output: >
    A `MarketIndustryContextModel` Pydantic model with the `company_information`, `management_information`, `market_overview`, `macroeconomic_factors`, `regulatory_environment`, `industry_trends`, `industry_growth_forecasts`, `industry_leaders`, and `competitor_landscape` fields populated.
  agent: researcher

writing_task:
  description: >
    Draft the "Market & Industry Context" section of the stock analysis report, incorporating the detailed findings from the research task and your knowledge source.
    The section should be structured as follows:
    - An introduction to the section.
    - A sub-section on **Company Information**, introducing the company.
    - A sub-section on **Management Information**, introducing the company's management and their compensation.
    - A sub-section on **Key Products and Services**, with an overview of the company's products and services.
    - A sub-section on **Business Model**, with an overview of how the company generates revenue.
    - A sub-section on **Market Overview**, with an overview of the market size, current conditions, and demand drivers.
    - A sub-section on **Macroeconomic Factors**, with an overview of the current economic trends and geopolitical factors impacting the industry.
    - A sub-section on **Regulatory Environment**, with an overview of the key regulations and policies impacting the industry.
    - A sub-section on **Industry Trends**, with an overview of the key trends shaping the industry.
    - A sub-section on **Industry Growth Forecasts**, with an overview of the industry growth forecasts.
    - A sub-section on **Industry Leaders**, with an overview of leading companies in the industry and how {company_name} compares to them.
    Each sub-section should clearly present the data gathered, along with insightful analysis and context.
    Guidelines:
    {writer_guidelines}
    Current date: {date_us}.
  expected_output: >
    A complete draft of the "Market & Industry Context" section, including:
    - An introduction to the section.
    - A sub-section for **Company Information**, using the `company_information` research.
    - A sub-section for **Management Information**, using the `management_information` research.
    - A sub-section for **Key Products and Services**, using the `key_products_and_services` research.
    - A sub-section for **Business Model**, using the `business_model` research.
    - A sub-section for **Market Overview**, using the `market_overview` research.
    - A sub-section for **Macroeconomic Factors**, using the `macroeconomic_factors` research.
    - A sub-section for **Regulatory Environment**, using the `regulatory_environment` research.
    - A sub-section for **Industry Trends**, using the `industry_trends` research.
    - A sub-section for **Industry Growth Forecasts**, using the `industry_growth_forecasts` research.
    - A sub-section for **Industry Leaders**, using the `industry_leaders` research.
    The output must be formatted as markdown without code blocks. Don't use emojis.
    You must begin the section with the heading: ## Market & Industry Context
  agent: writer

critic_task:
  description: >
    Review the drafted "Market & Industry Context" section for accuracy, clarity, coherence, and completeness.
    {critic_guidelines}
    Current date (ISO format): {date_iso}.
  expected_output: >
    A detailed critique of the draft, including specific suggestions for improvement.
    You must also output the full, verbatim draft section content that you have critiqued as well.
  agent: critic

editing_task:
  description: >
    Revise the "Market & Industry Context" section, incorporating the critic's feedback to enhance clarity, accuracy, and conciseness.
    Guidelines:
    {editor_guidelines}
    - Make sure the section begins with the heading: ## Market & Industry Context
    Current date: {date_us}.
  expected_output: >
    A final, polished version of the "Market & Industry Context" section, ready for inclusion in the stock analysis report.
    This should be a fully revised and improved version, addressing all feedback from the critic.
    The output must be formatted as markdown without code blocks.
  agent: editor
