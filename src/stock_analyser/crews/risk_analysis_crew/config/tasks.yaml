research_task:
  description: >
    You are researching content for the "Risk Disclosure & Mitigation" section of a stock analysis report about the stock of the following company: 

    Company name: {company_name}.
    
    Company ticker: {company_ticker}.

    Website: {company_website}
    
    Industry: {industry}.

    Current date (ISO format): {date_iso}.

    Gather data and insights on the risks to populate the `RiskAnalysisModel`.
    Focus on gathering information for the following fields:
    - `risk_analysis`: Analyze the company's risk profile, including calculated risk metrics and analysis.
    - `operational_risks`: Identify and analyze operational risks that could impact the company's stock performance.
    - `financial_risks`: Identify and analyze financial risks that could impact the company's stock performance.
    - `market_volatility`: Analyze current market conditions and identify potential volatility risks.
    - `regulatory_risks`: Identify and analyze regulatory challenges and their potential impact.
    - `macroeconomic_risks`: Analyze macroeconomic risks that could impact the company's stock performance.
    - `company_specific_issues`: Use the "qdrant_sec_filings_tool" to search the company's SEC 10-Q and 10-K filings for specific operational, financial, or strategic risks that could materially impact future stock performance.
    - `esg_risks`: Use the "YFinance ESG Tool" to identify and analyze any ESG risks that could impact the company's future stock performance.
    - `other_risks`: Identify and analyze any other relevant risks not covered in the previous categories.
    Use the tools available to you to gather information on each risk, including specific examples, data, and potential consequences.
  expected_output: >
    A `RiskAnalysisModel` Pydantic model with the `risk_analysis`, `operational_risks`, `financial_risks`, `market_volatility`, `regulatory_risks`, `macroeconomic_risks`, `company_specific_issues`, `esg_risks`, and `other_risks` fields populated.
  agent: researcher

writing_task:
  description: >
    Craft a compelling and easily understandable narrative for the "Risk Disclosure & Mitigation" section of the stock analysis report, incorporating the detailed findings from the research task provided to you.
    The section should be structured as follows:
    - An introduction to the section.
    - A sub-section on **Risk Analysis**, presenting calculated risk metrics and analysis.
    - A sub-section on **Operational Risks**, presenting identified operational risks, their potential impact on the company's stock, and proposed mitigation strategies.
    - A sub-section on **Financial Risks**, detailing identified financial risks and their potential impact, including debt levels, interest coverage ratio, and other financial metrics, and proposed mitigation strategies.
    - A sub-section on **Market Volatility**, presenting identified market volatility risks and their potential impact on the company's stock, and proposed mitigation strategies.
    - A sub-section on **Regulatory Risks**, detailing identified regulatory challenges, their potential impact, and possible mitigation strategies.
    - A sub-section on **Macroeconomic Risks**, analyzing identified macroeconomic risks and their potential impact on the company's stock performance, and proposed mitigation strategies.
    - A sub-section on **Company-Specific Issues**, highlighting specific operational, financial, or strategic risks discovered in the company's SEC filings, and their potential consequences for stock performance, and proposed mitigation strategies.
    - A sub-section on **ESG Risks**, analyzing identified ESG risks and their potential to affect the company's stock value and reputation, and proposed mitigation strategies.
    - A sub-section on **Other Risks**, covering any additional relevant risks not included in the previous categories, with analysis of their potential impact, and proposed mitigation strategies.
    Each sub-section should clearly present the data gathered, along with insightful analysis and context, including proposed mitigation strategies or actions investors might consider.
    Guidelines:
    {writer_guidelines}
    Current date: {date_us}.
  expected_output: >
    A complete draft of the "Risk Disclosure & Mitigation" section, including:
    - An introduction to the section.
    - A sub-section on Risk Analysis.
    - A sub-section on Operational Risks.
    - A sub-section on Financial Risks.
    - A sub-section on Market Volatility.
    - A sub-section on Regulatory Risks.
    - A sub-section on Macroeconomic Risks.
    - A sub-section on Company-Specific Issues.
    - A sub-section on ESG Risks.
    - A sub-section on Other Risks.
    The output must be formatted as markdown without code blocks.
    You must begin the section with the heading: ## Risk Disclosure & Mitigation
  agent: writer

critic_task:
  description: >
    Perform a rigorous critical review of the draft "Risk Disclosure & Mitigation" section, focusing on accuracy, clarity, coherence, completeness, and overall impact.
    {critic_guidelines}
    Current date (ISO format): {date_iso}.
  expected_output: >
    A detailed critique of the draft, including specific suggestions for improvement.
    You must also output the full, verbatim draft section content that you have critiqued as well.
  agent: critic

editing_task:
  description: >
    Revise the "Risk Disclosure & Mitigation" section, incorporating the critic's feedback to achieve the highest possible quality.
    Guidelines:
    {editor_guidelines}
    
    - Current date: {date_us}.
    - Make sure the section begins with the heading: ## Risk Disclosure & Mitigation
  expected_output: >
    A final, polished version of the "Risk Disclosure & Mitigation" section, ready for inclusion in the stock analysis report.
    This should be a fully revised and improved version, addressing all feedback from the critic.
    The output must be formatted as markdown without code blocks.
  agent: editor
