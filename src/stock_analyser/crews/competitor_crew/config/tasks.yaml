competitor_research_task:
  description: >
    Research and gather financial data and recent news for {company_name} and its competitors.

    The ticker of {company_name} is: {company_ticker}.

    The list of tickers of itscompetitors is: {competitors_list}.

    1. Use the `YFinanceCompetitorFinancialMetricsTool` tool to gather financial metrics of {company_name} and its competitors. Prepend the ticker of {company_name} to the list of its competitors' tickers anbd use this Python list as input for the tool.
    2. Use the `YFinanceCompetitorNewsTool` tool to gather news data of {company_name} and its competitors. Enter the list of competitors tickers as input.
    3. Structure the data in a `CompetitorResearch` model under the `financial_data` field
    4. Include financial metrics for BOTH {company_name} and its competitors in the `competitors_financials` list
    5. Add competitor news articles as `CompetitorNewsItem` objects in the `competitor_news` list

    Current date (ISO format): {date_iso}.

  expected_output: >
    A single `CompetitorResearch` model instance containing two fields:
    - `competitors_financials`: A list of `CompetitorData` objects for {company_name} and its competitors.
    - `competitor_news`: An list of `CompetitorNewsItem` objects for the competitors.
  agent: competitor_research_agent

competitor_section_writing_task:
  description: >
    Review the collected financial data (`competitors_financials` list) and news articles (`competitor_news` list) for {company_name}'s competitors.
    Compose a "Competitor Analysis" section for a stock analysis report that presents this information in a clear, engaging, and easily digestible manner.

    The section should consist of four main sub-sections:
    1. A markdown table summarizing the key financial metrics from the `competitors_financials` list, using {company_name} as a benchmark for comparison.
    2. Analysis of {company_name}'s financial performance relative to its competitors based on these figures.
    3. A placeholder for a chart.
    4. A summary of recent news about the competitors, sourced from the `competitor_news` list (you will need to iterate through this list and extract articles for each relevant ticker).

    1.) Create a markdown table summarizing the key financial metrics found in the `competitors_financials` list, using {company_name} as a benchmark for comparison.
    The table should include:
    - Revenue growth (year-over-year)
    - Net margin
    - Return on equity (ROE)
    - Price-to-sales ratio (PSR)
    - Price-to-earnings ratio (P/E)
    - Price-to-book ratio (P/B)

    2.) Provide analysis of {company_name}'s financial performance relative to its competitors based on these figures.

    3.) After this analysis, precisely insert the placeholder: `[competitorPrices]`.
    Do not add any other text or formatting to this placeholder.
    This placeholder will be replaced later with a chart showing the prices of {company_name} and its competitors.
    Continue with the rest of the section after the placeholder.

    4.) Using the `competitor_news` list from the context, iterate through each `CompetitorNewsItem`. For each item, highlight any significant news or research findings from its `articles` list that could potentially affect {company_name}.
    Include the source URL and publication date where provided, formatted with correct markdown link formatting, e.g. [publisher](https://example.com)

    You must begin the section `content` with the heading: ## Competitor Analysis

    Do not include a publication date as a separate heading.

    The output should be formatted as markdown (without code blocks).
    Make sure that special characters such as '$', '%', and '&' are not escaped.

    Current date: {date_us}.
  expected_output: >
    The "Competitor Analysis" section of the report. This must include:
    - a markdown table of the financial data
    - a comparative analysis of {company_name}'s financial performance in comparison to its competitors
    - the placeholder `[competitorPrices]`
    - a summary of any recent relevant news stories about the competitors that might affect {company_name}, including sources formatted with correct markdown link formatting, e.g. [publisher](https://example.com)
  agent: competitor_section_writing_agent
