research_task:
  description: >
    You are researching content for the "Future Outlook" section of a stock analysis report about the stock of the following company: 

    Company name: {company_name}.

    Company ticker: {company_ticker}.

    Website: {company_website}

    Industry: {industry}.

    Conduct in-depth research on the future outlook of {company_name} using the tools available to you to gather information.
    Focus on gathering information and populating the following fields:
    - `expected_industry_disruptions`: Emerging technologies, shifting consumer preferences, and other potential disruptions.
    - `long_term_strategic_initiatives`: R&D investments, partnerships, and other long-term strategic initiatives.
    - `macro_trends_impact`: The potential impact of interest rate changes, global economic policies, and other macro trends.
    - `catalysts_and_triggers`: Specific events, new product launches, M&A activity, and regulatory changes as potential catalysts and triggers for the company.
    - `strengths`: The company's strengths and competitive advantages going forward.
    - `weaknesses`: The company's weaknesses and competitive disadvantages going forward.
    - `opportunities`: The company's opportunities for growth and expansion going forward.
    - `threats`: Threats and challenges that could impact the company's future outlook going forward.
    - `other_outlook_possibilities`: Other potential future developments relevant to the company going forward.
    Current date (ISO format): {date_iso}.
  expected_output: >
    A `FutureOutlookModel` Pydantic model with the `expected_industry_disruptions`, `long_term_strategic_initiatives`, `macro_trends_impact`, `catalysts_and_triggers`, `strengths`, `weaknesses`, `opportunities`, `threats`, and `other_outlook_possibilities` fields populated.
  agent: researcher

writing_task:
  description: >
    Craft a cohesive, compelling and easily understandable narrative for the "Forward-Looking Outlook" report section for {company_name}, synthesizing the research findings from the `FutureOutlookModel` provided to you.
    The section should be structured as follows:
    - A brief introduction to the section.
    - A sub-section on **Expected Industry Disruptions**, presenting identified disruptions and their potential impact.
    - A sub-section on **Long-Term Strategic Initiatives**, detailing the company's key initiatives and their strategic implications.
    - A sub-section on **Macro Trends Impact**, analyzing the influence of broader economic and geopolitical factors.
    - A sub-section on **Catalysts and Triggers**, highlighting specific events that could significantly affect the company's trajectory.
    - A sub-section on **SWOT Analysis**, summarizing the company's strengths, weaknesses, opportunities, and threats.
    - A sub-section on **Other Outlook Possibilities**, exploring additional noteworthy future developments.
    Each subsection should clearly present the data gathered, along with insightful analysis and context.
    Guidelines:
    {writer_guidelines}
    Current date: {date_us}.
  expected_output: >
    A complete draft of the "Forward-Looking Outlook" section including:
    - A brief introduction to the section.
    - A sub-section for **Expected Industry Disruptions**, using the `expected_industry_disruptions` research.
    - A sub-section for **Long-Term Strategic Initiatives**, using the `long_term_strategic_initiatives` research.
    - A sub-section for **Macro Trends Impact**, using the `macro_trends_impact` research.
    - A sub-section for **Catalysts and Triggers**, using the `catalysts_and_triggers` research.
    - A sub-section for **SWOT Analysis**, using the `strengths`, `weaknesses`, `opportunities`, and `threats` research.
    - A sub-section for **Other Outlook Possibilities**, using the `other_outlook_possibilities` research.
    The output must be formatted as markdown without code blocks.
    You must begin the section with the heading: ## Forward-Looking Outlook
  agent: writer

critic_task:
  description: >
    Perform a rigorous critical review of the draft "Forward-Looking Outlook" section, focusing on accuracy, clarity, coherence, completeness, and overall impact.
    {critic_guidelines}
    Current date (ISO format): {date_iso}.
  expected_output: >
    A detailed critique of the "Forward-Looking Outlook" draft, including specific suggestions for improvement.
    The critique should identify any gaps in logic, areas lacking sufficient evidence, and opportunities to enhance clarity and flow.
    You must also output the full, verbatim draft section content that you have critiqued as well.
  agent: critic

editing_task:
  description: >
    Revise and finalize the "Forward-Looking Outlook" section, incorporating the critic's feedback to achieve the highest possible quality.
    Guidelines:
    {editor_guidelines}
    - Make sure the section begins with the heading: ## Forward-Looking Outlook
    Current date: {date_us}.
  expected_output: >
    A polished, final version of the "Forward-Looking Outlook" section, ready for inclusion in the overall stock analysis report.
    The report should be free of errors, well-formatted, and present a clear, insightful perspective on the future of {company_name}.
    The output must be formatted as markdown without code blocks.
  agent: editor
