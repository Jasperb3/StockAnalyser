bill_ackman_analysis_task:
  description: >
    Conduct a comprehensive analysis of the specified stock and formulate an investment recommendation,
    strictly adhering to the investment principles of Cathie Wood.

    Company name: {company_name}

    Ticker: {company_ticker}

    Key Considerations:
    - Evaluate brand strength, market position, or other moats.
    - Check free cash flow generation, stable or growing earnings.
    - Analyze balance sheet health (reasonable debt, good ROE).
    - Buy at a discount to intrinsic value; higher discount => stronger conviction.
    - Engage if management is suboptimal or if there's a path for strategic improvements.
    - Provide a rational, data-driven recommendation (bullish, bearish, or neutral).

    Guidelines:
    - Identify and analyze key moats (e.g., strong brand, network effects, efficient operations, unique technology).
    - Assess free cash flow generation and stability.
    - Evaluate balance sheet health (debt levels, ROE, cash position).
    - Consider valuation metrics (discount to intrinsic value, P/E ratio, EV/EBITDA).
    - Assess management quality and strategic direction.
    - Provide a rational, data-driven recommendation (bullish, bearish, or neutral).

    Leverage the available tools to gather all necessary data.

    When providing your reasoning, be thorough and specific by:
    1. Emphasize brand strength, moat, or unique market positioning.
    2. Review free cash flow generation and margin trends as key signals.
    3. Analyze leverage, share buybacks, and dividends as capital discipline metrics.
    4. Provide a valuation assessment with numerical backup (DCF, multiples, etc.).
    5. Identify any catalysts for activism or value creation (e.g., cost cuts, better capital allocation).
    6. Use a confident, analytic, and sometimes confrontational tone when discussing weaknesses or opportunities.
    
    Synthesize your findings into a clear, Bill Ackman-style investment signal that substantiates the investment recommendation with detailed reference to specific metrics in the analysis.

    Return your final recommendation (signal: bullish, neutral, or bearish) with a 0-100 confidence and a thorough reasoning section.
    
    For example, if bullish: "This business generates exceptional free cash flow with a 15% margin and has a dominant market position that competitors can't easily replicate. Trading at only 12x FCF, there's a 40% discount to intrinsic value, and management's recent capital allocation decisions suggest..."
    For example, if bearish: "Despite decent market position, FCF margins have deteriorated from 12% to 8% over three years. Management continues to make poor capital allocation decisions by pursuing low-ROIC acquisitions. Current valuation at 18x FCF provides no margin of safety given the operational challenges..."
  
  expected_output: >
    A rational recommendation (bullish, bearish, or neutral), with a confidence level (0-100) and clear, thorough reasoning.
  agent: bill_ackman_agent

bill_ackman_writeup_task:
  description: >
    Compose a concise, compelling summary of the Cathie Wood-style investment signal. This summary will be
    incorporated as a distinct section within a broader, comprehensive stock research report.

    Company name: {company_name}

    Ticker: {company_ticker}

    Current date: {date_us}

    Formatting and Style Guidelines:
    - Begin with the heading: ### Bill Ackman-style investment analysis
    - Adopt a first-person perspective, writing as if you are Bill Ackman.
    {expert_analyst_writer_prompt}

  expected_output: >
    A succinct, Markdown-formatted summary of the investment signal, free of code blocks, presenting a clear and definitive investment perspective.
  agent: bill_ackman_writer
